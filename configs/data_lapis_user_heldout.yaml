paths:
  datasets_root: /path/to/datasets
  outputs_root: /path/to/outputs

personalized_dataset:
  name: lapis
  root: /path/to/datasets/LAPIS

support_sizes:
  - 10
  - 20
  - 50
  - 100

user_split:
  protocol: user_heldout
  seed: 42
  train_user_count: 521
  val_user_count: 37
  test_user_count: 37
  val_from_train_users: true
  min_train_user_rows: 150
  min_val_user_rows: 150
  min_test_user_rows: 150
  train_episodes_per_user: 4
  val_episodes_per_user: 1
  test_episodes_per_user: 1
  split_file: /path/to/outputs/splits/lapis_user_heldout_521_37_seed42.json
