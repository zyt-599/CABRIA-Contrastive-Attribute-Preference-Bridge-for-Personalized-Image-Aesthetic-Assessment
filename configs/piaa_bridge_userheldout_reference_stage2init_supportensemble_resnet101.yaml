experiment:
  name: cabria_piaa_bridge_flickr_userheldout_reference_stage2init_supportensemble_resnet101
  seed: 42
  output_dir: /path/to/outputs/cabria_piaa_bridge_flickr_userheldout_reference_stage2init_supportensemble_resnet101
  stage1_checkpoint: /path/to/checkpoints/best_stage1.pt
  contrast_checkpoint: /path/to/checkpoints/best_stage1_contrast.pt
  stage2_init_checkpoint: /path/to/checkpoints/best_stage2_multishot.pt
backbone:
  model_name: resnet101
  model_dir: /path/to/backbone/torchvision
  pretrained: false
  show_download_progress: true
  use_naflex: false
  preferred_long_side: null
  max_num_patches: null
  image_size: 224
  embed_dim: 2048
  patch_size: 32
  adapter_dim: 512
  adapter_dropout: 0.1
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
model:
  num_attribute_tokens: 8
  num_preference_tokens: 5
  num_heads: 8
  projection_dim: 256
  dropout: 0.1
  residual_scale: 0.2
  residual_max: null
  bridge_residual_scale: 1.0
  cross_attention_bridge: true
  preference_mode: score_bins
  preference_memory_source: attribute_tokens
  preference_score_source: residual
  base_score_source: stage1
  preference_temperature: 1.0
  score_bin_temperature: 0.5
  stage1_delta_scale: 1.0
  piaa_token_fusion: true
  piaa_token_fusion_tokens: 4
  piaa_token_fusion_min_support: 10
  piaa_token_fusion_scale: 0.6
  piaa_token_fusion_detach: true
  piaa_token_fusion_mode: hard_topk
  piaa_token_fusion_temperature: 0.7
  direct_support_memory: false
  direct_support_memory_tokens: 0
  direct_support_memory_loo_tokens: 0
  direct_support_memory_scale: 0.0
  query_support_memory_topk: 0
  query_support_memory_scale: 0.0
  stage2_token_adapter: false
  stage2_token_adapter_hidden_dim: 256
  stage2_token_adapter_dropout: 0.0
  stage2_token_adapter_scale: 0.0
  support_encode_chunk_size: 16
  support_calibration: false
  calibration_hidden_dim: 128
  calibration_dropout: 0.05
  calibration_residual_gate_center: 1.0
  calibration_residual_gate_range: 0.5
  support_residual_retrieval: false
  support_residual_similarity_source: conditioned
  support_retrieval_temperature: 0.2
  support_retrieval_scale: 0.0
  support_retrieval_detach: true
  support_kernel_residual: false
  support_kernel_residual_temperature: 0.07
  support_kernel_residual_ridge: 0.2
  support_kernel_residual_scale: 0.0
  support_kernel_residual_shrinkage: 0.0
  support_kernel_residual_max_abs: 0.5
  support_kernel_residual_detach: true
  support_residual_fusion: false
  support_residual_fusion_components:
  - bridge
  - bridge_basis
  - kernel
  support_residual_fusion_ridge: 0.06
  support_residual_fusion_shrinkage: 6.0
  support_residual_fusion_max_abs_weight: 1.5
  support_residual_fusion_min_support: 50
  support_residual_fusion_validation_images: 24
  support_residual_fusion_validation_margin: 0.0
  support_residual_fusion_validation_metric: score_rank
  support_residual_fusion_detach: true
  support_residual_score_fit: false
  support_residual_score_fit_ridge: 0.06
  support_residual_score_fit_shrinkage: 6.0
  support_residual_score_fit_max_abs_scale: 1.5
  support_residual_score_fit_min_support: 50
  support_residual_score_fit_validation_images: 24
  support_residual_score_fit_validation_margin: 0.0
  support_residual_score_fit_detach: true
  support_residual_score_fit_candidate_scales:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  - 1.25
  - 1.5
  bridge_support_fit: false
  bridge_support_fit_ridge: 0.08
  bridge_support_fit_shrinkage: 16.0
  bridge_support_fit_max_abs_scale: 0.8
  bridge_support_fit_detach: true
  bridge_basis_fit: false
  bridge_basis_fit_ridge: 0.06
  bridge_basis_fit_shrinkage: 6.0
  bridge_basis_fit_scale: 0.35
  bridge_basis_fit_max_abs: 0.7
  bridge_basis_fit_detach: true
  transductive_retrieval: false
  transductive_mode: closed_form
  transductive_steps: 0
  transductive_alpha: 0.0
  transductive_ridge: 0.0001
  transductive_topk: 0
  residual_memory_levels: 0
  residual_memory_temperature: 0.7
  residual_memory_confidence_tau: 4.0
  residual_memory_min_confidence_scale: 0.5
  semantic_prompt_memory: false
  semantic_prompts: []
  semantic_memory_tokens: 0
  semantic_memory_temperature: 0.07
  semantic_memory_scale: 0.0
  tta_num_tokens: 0
  tta_init_std: 0.02
  tta_residual_log_scale_min: -1.5
  tta_residual_log_scale_max: 1.5
  tta_level_residual_log_scale_min: -0.5
  tta_level_residual_log_scale_max: 0.5
  tta_level_residual_bias_range: 0.25
  user_state_enabled: false
  user_state_dim: 32
  user_state_ridge: 0.15
  user_state_scale: 0.2
  user_state_detach_support_residual: true
data:
  image_prior_split: train_fit
  eval_query_size: 256
  num_workers: 8
  persistent_workers: false
  prefetch_factor: 1
  use_image_prior: true
amp:
  enabled: true
  dtype: bfloat16
loss:
  regression: smooth_l1
  support_ranking_mode: bradley_terry
  support_ranking_margin: 0.0
  support_ranking_max_pairs: 1024
evaluation:
  episodic_user_source: user_heldout
  episodic_user_split: test
  episodic_test_users_file: null
  episodic_seed: 42
  episodic_common_query: false
stage2_freeze:
  freeze_backbone: true
  freeze_adapter: true
  freeze_attribute_extractor: true
  freeze_general_head: true
  freeze_attribute_head: true
piaa_adaptation:
  epochs: 8
  lr: 0.0001
  weight_decay: 0.01
  support_chunk_size: 16
  max_support_images: 0
  support_leave_one_out: true
  lambda_support_regression: 0.5
  lambda_support_ranking: 1.0
  support_ranking_mode: bradley_terry
  support_ranking_margin: 0.0
  support_ranking_max_pairs: 1024
  adapt_residual_scalars: true
  lambda_scalar_l2: 0.001
  trainable_patterns:
  - bridge.
  - residual_head.
  model_overrides:
    piaa_token_fusion: true
    piaa_token_fusion_tokens: 4
    piaa_token_fusion_min_support: 10
    piaa_token_fusion_scale: 0.6
    piaa_token_fusion_mode: hard_topk
    piaa_token_fusion_temperature: 0.7
    support_residual_retrieval: false
    support_kernel_residual: false
    support_residual_fusion: false
    support_residual_score_fit: false
    user_state_enabled: false
    direct_support_memory: false
    query_support_memory_topk: 0
    bridge_support_fit: false
    bridge_basis_fit: false
    support_calibration: false
    bridge_residual_scale: 1.0
    residual_scale: 0.2
support_size_overrides:
  '10':
    piaa_adaptation:
      epochs: 8
      lr: 0.0001
      weight_decay: 0.01
      support_chunk_size: 16
      support_ensemble_count: 3
      support_ensemble_fractions:
      - 1.0
      - 0.9
      - 0.8
      lambda_support_regression: 0.5
      lambda_support_ranking: 1.0
      support_ranking_max_pairs: 1024
      lambda_scalar_l2: 0.001
      model_overrides:
        piaa_token_fusion: true
        piaa_token_fusion_tokens: 4
        piaa_token_fusion_min_support: 10
        piaa_token_fusion_scale: 0.6
        piaa_token_fusion_mode: hard_topk
        piaa_token_fusion_temperature: 0.7
        support_residual_fusion: false
        support_residual_score_fit: false
        support_kernel_residual: false
        bridge_support_fit: false
        bridge_basis_fit: false
  '100':
    piaa_adaptation:
      epochs: 10
      lr: 0.001
      weight_decay: 0.005
      support_chunk_size: 20
      support_ensemble_count: 5
      support_ensemble_fractions:
      - 1.0
      - 0.95
      - 0.9
      - 0.85
      - 0.8
      lambda_support_regression: 0.25
      lambda_support_ranking: 2.0
      support_ranking_max_pairs: 4096
      lambda_scalar_l2: 0.003
      grad_clip_norm: 1.0
      trainable_patterns:
      - stage2_token_adapter.
      - residual_head.
      model_overrides:
        stage2_token_adapter: true
        stage2_token_adapter_hidden_dim: 256
        stage2_token_adapter_dropout: 0.0
        stage2_token_adapter_scale: 0.5
        piaa_token_fusion: true
        piaa_token_fusion_tokens: 8
        piaa_token_fusion_min_support: 50
        piaa_token_fusion_scale: 0.8
        piaa_token_fusion_mode: residual_softmax
        piaa_token_fusion_temperature: 0.7
        bridge_support_fit: true
        bridge_basis_fit: true
        support_kernel_residual: true
        support_kernel_residual_scale: 0.15
        support_kernel_residual_ridge: 0.06
        support_kernel_residual_shrinkage: 6.0
        support_kernel_residual_max_abs: 0.8
        support_kernel_residual_detach: true
        support_residual_fusion: true
        support_residual_fusion_components:
        - bridge
        - bridge_basis
        - kernel
        support_residual_score_fit: false
