# Final CABRIA pipeline config. Historical experiment suffixes were removed from active paths.
experiment:
  name: cabria_stage2_flickr_userheldout_reference_resnet101_singlegpu
  seed: 42
  output_dir: /path/to/outputs/cabria_stage2_flickr_userheldout_reference_resnet101_singlegpu
  stage1_checkpoint: /path/to/checkpoints/best_stage1.pt
  contrast_checkpoint: /path/to/checkpoints/best_stage1_contrast.pt
  checkpoint_label: multishot
  save_epoch_checkpoints: true
distributed:
  find_unused_parameters: true
backbone:
  model_name: resnet101
  model_dir: /path/to/backbone/torchvision
  pretrained: false
  show_download_progress: true
  use_naflex: false
  preferred_long_side: null
  max_num_patches: null
  image_size: 224
  embed_dim: 2048
  patch_size: 32
  adapter_dim: 512
  adapter_dropout: 0.1
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
model:
  num_attribute_tokens: 8
  num_preference_tokens: 5
  num_heads: 8
  projection_dim: 256
  dropout: 0.1
  residual_scale: 0.2
  residual_max: null
  bridge_residual_scale: 1.0
  cross_attention_bridge: true
  preference_mode: score_bins
  preference_memory_source: attribute_tokens
  preference_score_source: residual
  base_score_source: stage1
  preference_temperature: 1.0
  score_bin_temperature: 0.5
  stage1_delta_scale: 1.0
  direct_support_memory: false
  direct_support_memory_tokens: 0
  direct_support_memory_loo_tokens: 0
  direct_support_memory_scale: 0.0
  query_support_memory_topk: 0
  query_support_memory_scale: 0.0
  stage2_token_adapter: false
  stage2_token_adapter_hidden_dim: 256
  stage2_token_adapter_dropout: 0.0
  stage2_token_adapter_scale: 0.0
  support_encode_chunk_size: 16
  support_calibration: true
  calibration_hidden_dim: 128
  calibration_dropout: 0.05
  calibration_residual_gate_center: 1.0
  calibration_residual_gate_range: 0.5
  support_residual_retrieval: true
  support_retrieval_temperature: 0.2
  support_retrieval_scale: 0.15
  support_retrieval_detach: true
  transductive_retrieval: false
  transductive_mode: closed_form
  transductive_steps: 0
  transductive_alpha: 0.0
  transductive_ridge: 0.0001
  transductive_topk: 0
  support_kernel_residual: false
  support_kernel_residual_temperature: 0.07
  support_kernel_residual_ridge: 0.2
  support_kernel_residual_scale: 0.0
  support_kernel_residual_max_abs: 0.5
  support_kernel_residual_detach: true
  residual_memory_levels: 5
  residual_memory_temperature: 0.7
  residual_memory_confidence_tau: 4.0
  residual_memory_min_confidence_scale: 0.5
  semantic_prompt_memory: false
  semantic_prompts: []
  semantic_memory_tokens: 0
  semantic_memory_temperature: 0.07
  semantic_memory_scale: 0.0
  tta_num_tokens: 0
  tta_init_std: 0.02
  tta_residual_log_scale_min: -1.5
  tta_residual_log_scale_max: 1.5
  tta_level_residual_log_scale_min: -0.5
  tta_level_residual_log_scale_max: 0.5
  tta_level_residual_bias_range: 0.25
  user_state_enabled: true
  user_state_dim: 32
  user_state_ridge: 0.15
  user_state_scale: 0.2
  user_state_detach_support_residual: true
  support_residual_fusion: false
data:
  train_split: train_fit
  image_prior_split: train_fit
  train_episode_batch_size: 8
  train_query_size: 64
  dynamic_train_episodes: true
  train_episodes_per_user: 8
  eval_query_size: 256
  num_workers: 8
  eval_num_workers: 0
  persistent_workers: false
  prefetch_factor: 1
  use_image_prior: true
  backward_per_episode: true
amp:
  enabled: true
  dtype: bfloat16
optimization:
  epochs: 3
  lr: 0.0001
  weight_decay: 0.0001
  scheduler:
    name: cosine
    warmup_epochs: 1
    min_lr_ratio: 0.2
  early_stopping:
    enabled: false
    patience: 0
    min_delta: 0.0
loss:
  regression: smooth_l1
  lambda_regression: 0.5
  lambda_query_ranking: 1.0
  query_ranking_margin: 0.5
  lambda_residual_target: 1.0
  lambda_residual_l2: 0.001
  lambda_support_reconstruction: 0.3
  lambda_support_ranking: 0.2
  support_ranking_margin: 0.5
  support_loo_max_items: 24
  lambda_calibration_l2: 0.0
  lambda_support_query_residual_alignment: 0.0
  support_query_alignment_feature_temperature: 0.07
  support_query_alignment_residual_temperature: 0.25
  query_ranking_mode: bradley_terry
  support_ranking_mode: bradley_terry
  query_ranking_max_pairs: 2048
  support_ranking_max_pairs: 512
test_time_adaptation:
  enabled: false
  train_enabled: false
  steps: 0
  lr: 0.0
  max_support_images: 0
  support_chunk_size: 16
  lambda_support_regression: 0.0
  lambda_support_ranking: 0.0
  support_ranking_margin: 0.5
  lambda_l2: 0.0
  support_srcc_init: false
  support_validation_images: 0
  support_validation_min_rank_improvement: 0.0
  support_validation_shrink: 0.0
  support_validation_holdout: false
support_size_overrides:
  '100':
    optimization:
      epochs: 15
      scheduler:
        warmup_epochs: 2
    data:
      train_episode_batch_size: 4
      train_episodes_per_user: 8
      train_query_size: 64
      backward_per_episode: true
    evaluation:
      selection_tta_enabled: true
      selection_repeats: 3
      selection_gain_weight: 2.0
      selection_base_penalty: 0.5
      selection_same_image_weight: 0.02
      selection_residual_corr_weight: 0.1
      selection_residual_corr_metric: support_estimator_residual_macro_spearman
      episodic_val_repeats: 3
    model:
      residual_scale: 0.18
      bridge_residual_scale: 1.0
      bridge_support_fit: true
      bridge_support_fit_ridge: 0.08
      bridge_support_fit_shrinkage: 28.0
      bridge_support_fit_max_abs_scale: 1.0
      bridge_support_fit_detach: true
      bridge_basis_fit: true
      bridge_basis_fit_ridge: 0.05
      bridge_basis_fit_shrinkage: 8.0
      bridge_basis_fit_scale: 0.45
      bridge_basis_fit_max_abs: 0.8
      bridge_basis_fit_detach: true
      support_residual_fusion: false
      support_residual_fusion_components:
      - bridge_basis
      - bridge
      - retrieved
      - user_state
      support_residual_fusion_ridge: 0.04
      support_residual_fusion_shrinkage: 4.0
      support_residual_fusion_max_abs_weight: 2.0
      support_residual_fusion_min_support: 50
      support_residual_fusion_validation_images: 24
      support_residual_fusion_validation_margin: 0.0
      support_residual_fusion_validation_metric: score_rank
      support_residual_fusion_detach: true
      direct_support_memory: true
      direct_support_memory_tokens: 128
      direct_support_memory_loo_tokens: 64
      direct_support_memory_scale: 0.12
      query_support_memory_topk: 8
      query_support_memory_scale: 0.1
      support_retrieval_scale: 0.35
      support_kernel_residual: true
      support_kernel_residual_scale: 0.18
      support_kernel_residual_ridge: 0.08
      support_kernel_residual_shrinkage: 5.0
      support_kernel_residual_max_abs: 0.8
      support_kernel_residual_detach: false
      support_residual_similarity_source: conditioned
      user_state_enabled: true
      user_state_dim: 32
      user_state_ridge: 0.08
      user_state_scale: 0.22
      tta_num_tokens: 4
      tta_residual_log_scale_min: -1.0
      tta_residual_log_scale_max: 1.0
      tta_level_residual_log_scale_min: -0.35
      tta_level_residual_log_scale_max: 0.35
      support_encode_chunk_size: 8
    loss:
      support_loo_max_items: 32
      lambda_regression: 0.25
      lambda_query_ranking: 2.0
      lambda_residual_target: 1.0
      lambda_retrieved_residual_target: 0.6
      lambda_support_estimator_residual_target: 1.0
      lambda_support_estimator_residual_ranking: 0.4
      lambda_query_residual_ranking: 0.4
      lambda_support_residual_ranking: 0.15
      lambda_support_reconstruction: 0.25
      lambda_support_ranking: 0.2
      lambda_support_query_residual_alignment: 0.05
      lambda_residual_l2: 0.005
      query_ranking_max_pairs: 4096
      support_ranking_max_pairs: 512
    test_time_adaptation:
      enabled: true
      train_enabled: false
      steps: 6
      lr: 0.02
      max_support_images: 100
      support_chunk_size: 16
      support_leave_one_out: true
      support_srcc_init: true
      support_validation_images: 24
      support_validation_min_rank_improvement: -0.002
      support_validation_shrink: 0.35
      support_validation_holdout: true
      lambda_support_regression: 0.15
      lambda_support_ranking: 2.0
      lambda_l2: 0.005
      model_parameter_adaptation: true
      model_parameter_patterns:
      - contrast_stage1.backbone.adapter
      - contrast_stage1.general_head
      - contrast_stage1.attribute_head
      - bridge.
      - residual_head.
      model_parameter_steps: 10
      model_parameter_lr: 0.001
      model_parameter_lambda_support_regression: 0.05
      model_parameter_lambda_support_ranking: 2.5
      model_parameter_support_chunk_size: 16
      model_parameter_support_ranking_max_pairs: 4096
      model_parameter_support_leave_one_out: true
      model_parameter_validation_images: 24
      model_parameter_validation_holdout: true
      model_parameter_validation_min_rank_improvement: 0.0
evaluation:
  query_forward_chunk_size: 16
  iupa_delta: 0.0
  acc_threshold: null
  val_protocol: episodic
  episodic_val_common_query: true
  episodic_val_query_support_size: 100
  selection_tta_enabled: true
  selection_repeats: 3
  selection_base_penalty: 0.5
  selection_gain_weight: 2.0
  selection_same_image_weight: 0.02
  print_repeated_test_hint: true
  episodic_user_source: split
  episodic_seed: 42
  episodic_repeats: 10
  episodic_val_user_source: split
  episodic_val_seed: 42
  episodic_val_repeats: 3
  selection_residual_corr_weight: 0.05
  selection_residual_corr_metric: residual_macro_spearman
stage2_freeze:
  freeze_backbone: true
  freeze_adapter: true
  freeze_attribute_extractor: true
  freeze_general_head: true
  freeze_attribute_head: true
