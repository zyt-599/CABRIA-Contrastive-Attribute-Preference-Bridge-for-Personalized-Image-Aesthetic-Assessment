experiment:
  name: stage1_flickr_para_lapis
  seed: 42
  output_dir: /path/to/outputs/stage1_flickr_para_lapis
backbone:
  model_name: resnet101
  model_dir: /path/to/backbone/torchvision
  pretrained: true
  show_download_progress: true
  use_naflex: false
  preferred_long_side: null
  max_num_patches: null
  image_size: 224
  embed_dim: 2048
  patch_size: 16
  adapter_dim: 512
  adapter_dropout: 0.1
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
model:
  num_attribute_tokens: 8
  num_preference_tokens: 4
  num_heads: 8
  projection_dim: 256
  dropout: 0.1
data:
  batch_size: 4
  eval_batch_size: 8
  num_workers: 2
amp:
  enabled: true
  dtype: bfloat16
optimization:
  epochs: 200
  lr: 5.0e-05
  weight_decay: 0.0001
  scheduler:
    name: cosine
    warmup_epochs: 3
    min_lr_ratio: 0.1
  early_stopping:
    enabled: true
    patience: 25
    min_delta: 0.0002
loss:
  regression: smooth_l1
  lambda_attribute_regression: 0.5
  lambda_ranking: 0.1
  ranking_margin: 0.1
  lambda_attribute_diversity: 0.0
